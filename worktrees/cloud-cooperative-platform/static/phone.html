<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>手机拍照上传 · Loongson AOI</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --line: #d9e2ec;
      --text: #17202a;
      --muted: #667085;
      --blue: #1769aa;
      --green: #218057;
      --red: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    }

    main {
      width: min(720px, 100%);
      margin: 0 auto;
      padding: 18px;
    }

    header {
      margin: 8px 0 18px;
    }

    .brand {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0;
    }

    h1 {
      margin: 8px 0 8px;
      font-size: clamp(24px, 8vw, 34px);
      line-height: 1.15;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 12px 28px rgba(23, 32, 42, 0.06);
    }

    label {
      display: grid;
      gap: 8px;
      margin: 16px 0;
      color: #344054;
      font-size: 14px;
      font-weight: 600;
    }

    input[type="file"] {
      width: 100%;
      padding: 14px;
      border: 1px dashed #9fb3c8;
      border-radius: 8px;
      background: #f8fafc;
      color: var(--text);
      font-size: 15px;
    }

    button {
      width: 100%;
      min-height: 46px;
      border: 0;
      border-radius: 8px;
      background: var(--blue);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    .status {
      margin-top: 12px;
      min-height: 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .status.ok {
      color: var(--green);
    }

    .status.bad {
      color: var(--red);
    }

    .picker-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 16px 0 10px;
    }

    .picker-btn.secondary {
      border: 1px solid #b9c7d6;
      background: #ffffff;
      color: var(--blue);
    }

    .hidden-input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .preview {
      margin-top: 16px;
      display: none;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #eef3f8;
    }

    .preview img {
      display: block;
      width: 100%;
      max-height: 56vh;
      object-fit: contain;
      background: #ffffff;
    }

    .recent {
      margin-top: 18px;
    }

    .worker {
      margin: 14px 0;
      display: grid;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      color: var(--muted);
      font-size: 13px;
    }

    .worker strong {
      color: var(--text);
      font-size: 15px;
    }

    .recent h2 {
      margin: 0 0 10px;
      font-size: 17px;
      letter-spacing: 0;
    }

    .upload-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .upload-list li {
      display: grid;
      gap: 2px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      font-size: 14px;
    }

    .upload-list span {
      color: var(--muted);
      font-size: 12px;
    }

    .batch-section {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .batch-heading,
    .batch-actions,
    .profile-actions {
      display: grid;
      gap: 8px;
    }

    .batch-heading {
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
    }

    .batch-actions {
      grid-template-columns: repeat(2, minmax(110px, 1fr));
    }

    .batch-actions button {
      width: auto;
      min-height: 38px;
      padding: 8px 12px;
      font-size: 13px;
    }

    button.danger {
      background: #fff;
      border: 1px solid #d92d20;
      color: #b42318;
    }

    .profile-actions {
      grid-template-columns: 1fr 1fr;
      margin: 12px 0;
    }

    .profile-actions select {
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
    }

    .batch-results {
      display: grid;
      gap: 10px;
    }

    .batch-card {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 10px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
    }

    .batch-card-media {
      display: grid;
      gap: 5px;
    }

    .batch-card-frame {
      display: grid;
      gap: 2px;
    }

    .batch-card-frame small {
      color: var(--muted);
      font-size: 10px;
      text-align: center;
    }

    .batch-card img {
      width: 92px;
      height: 76px;
      object-fit: cover;
      background: #eef3f8;
    }

    .batch-card-body {
      min-width: 0;
      display: grid;
      gap: 5px;
    }

    .batch-card-body strong,
    .batch-card-body span {
      overflow-wrap: anywhere;
    }

    .batch-card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .batch-card-actions button,
    .batch-card-actions a {
      width: auto;
      min-height: 32px;
      padding: 6px 9px;
      border: 1px solid #b9c7d6;
      border-radius: 5px;
      background: #fff;
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }

    @media (max-width: 560px) {
      .batch-heading,
      .profile-actions {
        grid-template-columns: 1fr;
      }

      .batch-actions {
        grid-template-columns: 1fr 1fr;
      }

      .batch-card {
        grid-template-columns: 72px minmax(0, 1fr);
      }

      .batch-card img {
        width: 72px;
        height: 64px;
      }
    }

    .nav {
      margin-top: 16px;
      display: inline-flex;
      color: var(--blue);
      font-size: 14px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand">Loongson AOI</div>
      <h1>手机拍照上传</h1>
      <p>拍照或选择 PCB 图片后上传到电脑/龙芯教育派。检测由电脑端第五模块人工选择后启动。</p>
    </header>

    <section class="panel">
      <div class="worker">
        <strong>手机推理节点</strong>
        <span id="workerStatus">正在连接推理通道...</span>
      </div>
      <div class="picker-actions">
        <button class="picker-btn" id="takePhotoBtn" type="button">拍照</button>
        <button class="picker-btn secondary" id="chooseGalleryBtn" type="button">从图库选择</button>
      </div>
      <input id="cameraInput" class="hidden-input" type="file" accept="image/*" capture="environment" />
      <input id="galleryInput" class="hidden-input" type="file" accept="image/*" multiple />
      <button id="uploadBtn" type="button">上传本次照片（最多9张）</button>
      <div id="status" class="status">等待拍照或选择图片</div>
      <div id="preview" class="preview">
        <img id="previewImage" alt="已选择照片预览" />
      </div>
    </section>

    <section class="recent batch-section">
      <div class="batch-heading">
        <div>
          <h2>本次上传</h2>
          <p id="batchSummary">尚未创建批次</p>
        </div>
        <div class="batch-actions">
          <button id="detectBatchBtn" type="button" disabled>检测本次全部</button>
          <button id="deleteBatchBtn" class="danger" type="button" disabled>删除本次批次</button>
        </div>
      </div>
      <div class="profile-actions">
        <select id="profileSelect" aria-label="检测模式">
          <option value="fast">快速模式</option>
          <option value="precision">高精模式</option>
        </select>
        <select id="experimentSelect" aria-label="检测实验档位">
          <option value="cloud_baseline">华为云</option>
          <option value="phone_link_sim">手机</option>
          <option value="local_link_sim">网站后端服务器</option>
        </select>
      </div>
      <div id="batchResults" class="batch-results">
        <p>本次尚未上传照片</p>
      </div>
    </section>

    <section class="recent">
      <h2>历史上传</h2>
      <ul id="uploadList" class="upload-list">
        <li>正在读取上传列表...</li>
      </ul>
    </section>

    <a class="nav" href="/">返回完整 AOI 网站</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <script>
    const cameraInput = document.getElementById("cameraInput");
    const galleryInput = document.getElementById("galleryInput");
    const takePhotoBtn = document.getElementById("takePhotoBtn");
    const chooseGalleryBtn = document.getElementById("chooseGalleryBtn");
    const uploadBtn = document.getElementById("uploadBtn");
    const statusNode = document.getElementById("status");
    const preview = document.getElementById("preview");
    const previewImage = document.getElementById("previewImage");
    const uploadList = document.getElementById("uploadList");
    const workerStatus = document.getElementById("workerStatus");
    const batchResults = document.getElementById("batchResults");
    const batchSummary = document.getElementById("batchSummary");
    const detectBatchBtn = document.getElementById("detectBatchBtn");
    const deleteBatchBtn = document.getElementById("deleteBatchBtn");
    const profileSelect = document.getElementById("profileSelect");
    const experimentSelect = document.getElementById("experimentSelect");
    let selectedFiles = [];
    let currentBatchId = window.localStorage.getItem("aoiCurrentPhoneBatchId") || "";
    let currentBatch = null;
    let batchPollTimer = null;
    let workerSocket = null;
    let inferenceRuntime = null;
    let inferenceSession = null;
    let inferenceInputName = "";
    let inferenceOutputName = "";

    function setStatus(text, tone = "") {
      statusNode.textContent = text;
      statusNode.classList.remove("ok", "bad");
      if (tone) statusNode.classList.add(tone);
    }

    function setWorkerStatus(text) {
      workerStatus.textContent = text;
    }

    function formatBytes(bytes) {
      if (!bytes) return "-";
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
    }

    function artifactUrl(path) {
      return `/api/artifact?path=${encodeURIComponent(path)}`;
    }

    function imageStem(filename) {
      const dot = filename.lastIndexOf(".");
      return dot > 0 ? filename.slice(0, dot) : filename || "phone-pcb";
    }

    function loadImageElement(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const image = new Image();
        image.onload = () => {
          URL.revokeObjectURL(url);
          resolve(image);
        };
        image.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("图片无法在浏览器端解码"));
        };
        image.src = url;
      });
    }

    function canvasToBlob(canvas, type, quality) {
      return new Promise((resolve) => {
        canvas.toBlob((blob) => resolve(blob), type, quality);
      });
    }

    function convertCanvasToGrayscale(ctx, width, height) {
      const imageData = ctx.getImageData(0, 0, width, height);
      const data = imageData.data;
      for (let index = 0; index < data.length; index += 4) {
        const gray = Math.round(data[index] * 0.299 + data[index + 1] * 0.587 + data[index + 2] * 0.114);
        data[index] = gray;
        data[index + 1] = gray;
        data[index + 2] = gray;
      }
      ctx.putImageData(imageData, 0, 0);
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function nmsDetections(detections, iouThreshold = 0.45) {
      const grouped = new Map();
      for (const detection of detections) {
        const key = detection.type || "";
        if (!grouped.has(key)) grouped.set(key, []);
        grouped.get(key).push(detection);
      }
      const kept = [];
      for (const items of grouped.values()) {
        items.sort((a, b) => Number(b.confidence || 0) - Number(a.confidence || 0));
        const classKept = [];
        for (const item of items) {
          if (classKept.every((existing) => bboxIou(item.bbox, existing.bbox) < iouThreshold)) {
            classKept.push(item);
          }
        }
        kept.push(...classKept);
      }
      return kept.sort((a, b) => Number(b.confidence || 0) - Number(a.confidence || 0));
    }

    function bboxIou(a, b) {
      const ix1 = Math.max(a[0], b[0]);
      const iy1 = Math.max(a[1], b[1]);
      const ix2 = Math.min(a[2], b[2]);
      const iy2 = Math.min(a[3], b[3]);
      const iw = Math.max(0, ix2 - ix1);
      const ih = Math.max(0, iy2 - iy1);
      const inter = iw * ih;
      if (inter <= 0) return 0;
      const areaA = Math.max(0, a[2] - a[0]) * Math.max(0, a[3] - a[1]);
      const areaB = Math.max(0, b[2] - b[0]) * Math.max(0, b[3] - b[1]);
      const union = areaA + areaB - inter;
      return union ? inter / union : 0;
    }

    async function loadRuntime() {
      if (inferenceRuntime && inferenceSession) return inferenceRuntime;
      if (!window.ort) {
        throw new Error("onnxruntime-web 未加载，请确认手机可以访问 CDN 或连接互联网");
      }
      const response = await fetch("/api/phone-inference/runtime");
      if (!response.ok) throw new Error(`runtime ${response.status}`);
      inferenceRuntime = await response.json();
      const modelUrl = `${inferenceRuntime.model_url}?ts=${Date.now()}`;
      try {
        inferenceSession = await ort.InferenceSession.create(modelUrl, { executionProviders: ["webgpu", "wasm"] });
      } catch (error) {
        inferenceSession = await ort.InferenceSession.create(modelUrl, { executionProviders: ["wasm"] });
      }
      inferenceInputName = inferenceSession.inputNames[0];
      inferenceOutputName = inferenceSession.outputNames[0];
      return inferenceRuntime;
    }

    async function imageFromUrl(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`image ${response.status}`);
      const blob = await response.blob();
      return loadImageElement(new File([blob], "inference.jpg", { type: blob.type || "image/jpeg" }));
    }

    function preprocessImage(image, imgsz) {
      const sourceWidth = image.naturalWidth || image.width;
      const sourceHeight = image.naturalHeight || image.height;
      const scale = Math.min(imgsz / Math.max(sourceWidth, 1), imgsz / Math.max(sourceHeight, 1));
      const resizedWidth = Math.max(1, Math.round(sourceWidth * scale));
      const resizedHeight = Math.max(1, Math.round(sourceHeight * scale));
      const padX = Math.round((imgsz - resizedWidth) / 2);
      const padY = Math.round((imgsz - resizedHeight) / 2);
      const canvas = document.createElement("canvas");
      canvas.width = imgsz;
      canvas.height = imgsz;
      const ctx = canvas.getContext("2d", { alpha: false, willReadFrequently: true });
      ctx.fillStyle = "rgb(114,114,114)";
      ctx.fillRect(0, 0, imgsz, imgsz);
      ctx.drawImage(image, padX, padY, resizedWidth, resizedHeight);
      const pixels = ctx.getImageData(0, 0, imgsz, imgsz).data;
      const data = new Float32Array(3 * imgsz * imgsz);
      const plane = imgsz * imgsz;
      for (let index = 0, pixel = 0; index < pixels.length; index += 4, pixel += 1) {
        data[pixel] = pixels[index] / 255;
        data[plane + pixel] = pixels[index + 1] / 255;
        data[plane * 2 + pixel] = pixels[index + 2] / 255;
      }
      return {
        tensor: new ort.Tensor("float32", data, [1, 3, imgsz, imgsz]),
        sourceWidth,
        sourceHeight,
        scale,
        padX,
        padY,
      };
    }

    function decodeYoloOutput(output, meta, runtime) {
      const names = runtime.names || {};
      const cnNames = runtime.cn_names || {};
      const classCount = Object.keys(names).length;
      const dims = output.dims || [];
      const values = output.data;
      const rows = [];
      if (dims.length === 3 && dims[1] === classCount + 4) {
        const count = dims[2];
        for (let i = 0; i < count; i += 1) {
          const row = [];
          for (let j = 0; j < classCount + 4; j += 1) row.push(values[j * count + i]);
          rows.push(row);
        }
      } else if (dims.length === 3 && dims[2] === classCount + 4) {
        const count = dims[1];
        for (let i = 0; i < count; i += 1) {
          const row = [];
          for (let j = 0; j < classCount + 4; j += 1) row.push(values[i * (classCount + 4) + j]);
          rows.push(row);
        }
      } else {
        throw new Error(`不支持的 ONNX 输出形状: ${dims.join("x")}`);
      }
      const detections = [];
      for (const row of rows) {
        let classId = 0;
        let confidence = -Infinity;
        for (let i = 0; i < classCount; i += 1) {
          if (row[4 + i] > confidence) {
            confidence = row[4 + i];
            classId = i;
          }
        }
        if (confidence < Number(runtime.conf || 0.5)) continue;
        const cx = row[0];
        const cy = row[1];
        const w = row[2];
        const h = row[3];
        const x1 = clamp(Math.round((cx - w / 2 - meta.padX) / meta.scale), 0, meta.sourceWidth - 1);
        const y1 = clamp(Math.round((cy - h / 2 - meta.padY) / meta.scale), 0, meta.sourceHeight - 1);
        const x2 = clamp(Math.round((cx + w / 2 - meta.padX) / meta.scale), x1 + 1, meta.sourceWidth);
        const y2 = clamp(Math.round((cy + h / 2 - meta.padY) / meta.scale), y1 + 1, meta.sourceHeight);
        const type = names[String(classId)] || String(classId);
        detections.push({
          type,
          label: cnNames[type] || type,
          bbox: [x1, y1, x2, y2],
          confidence: Math.round(confidence * 10000) / 10000,
        });
      }
      return nmsDetections(detections);
    }

    async function runInferenceJob(payload) {
      const runtime = await loadRuntime();
      const started = performance.now();
      const image = await imageFromUrl(payload.image_url);
      const meta = preprocessImage(image, Number(runtime.imgsz || 640));
      const feeds = {};
      feeds[inferenceInputName] = meta.tensor;
      const outputs = await inferenceSession.run(feeds);
      const output = outputs[inferenceOutputName] || Object.values(outputs)[0];
      const defects = decodeYoloOutput(output, meta, runtime);
      return {
        ok: true,
        job_id: payload.job_id,
        defects,
        inference_ms: Math.round((performance.now() - started) * 100) / 100,
        inference_location: "phone_browser",
        runtime: {
          backend: runtime.backend,
          imgsz: runtime.imgsz,
          execution_provider: "onnxruntime-web",
        },
      };
    }

    async function connectInferenceWorker() {
      const protocol = location.protocol === "https:" ? "wss" : "ws";
      workerSocket = new WebSocket(`${protocol}://${location.host}/ws/phone-inference`);
      workerSocket.addEventListener("open", async () => {
        setWorkerStatus("推理通道已连接，正在加载 ONNX 模型...");
        workerSocket.send(JSON.stringify({
          type: "worker_hello",
          payload: { user_agent: navigator.userAgent, ready: false },
        }));
        try {
          const runtime = await loadRuntime();
          workerSocket.send(JSON.stringify({
            type: "worker_ready",
            payload: { user_agent: navigator.userAgent, ready: true, runtime },
          }));
          setWorkerStatus(`手机推理节点已就绪 · imgsz=${runtime.imgsz} · conf=${runtime.conf}`);
        } catch (error) {
          setWorkerStatus(`手机推理节点不可用：${error.message || error}`);
        }
      });
      workerSocket.addEventListener("close", () => {
        setWorkerStatus("推理通道已断开，2 秒后重连...");
        window.setTimeout(connectInferenceWorker, 2000);
      });
      workerSocket.addEventListener("message", async (event) => {
        const packet = JSON.parse(event.data);
        const payload = packet.payload || {};
        if (packet.type !== "inference_request") return;
        try {
          setWorkerStatus(`正在手机端推理 job=${payload.job_id.slice(0, 8)}...`);
          const result = await runInferenceJob(payload);
          workerSocket.send(JSON.stringify({ type: "inference_result", payload: result }));
          setWorkerStatus(`手机端推理完成 · 缺陷 ${result.defects.length} · ${Math.round(result.inference_ms)}ms`);
        } catch (error) {
          workerSocket.send(JSON.stringify({
            type: "inference_error",
            payload: { ok: false, job_id: payload.job_id, message: error.message || String(error) },
          }));
          setWorkerStatus(`手机端推理失败：${error.message || error}`);
        }
      });
    }

    async function compressImageForUpload(file) {
      const maxDimension = 1600;
      const quality = 0.82;
      if (!file.type || !file.type.startsWith("image/")) {
        return { blob: file, filename: file.name, compressed: false, grayscale: false, originalSize: file.size, uploadSize: file.size };
      }

      const image = await loadImageElement(file);
      const sourceWidth = image.naturalWidth || image.width;
      const sourceHeight = image.naturalHeight || image.height;
      const scale = Math.min(1, maxDimension / Math.max(sourceWidth, sourceHeight));
      const width = Math.max(1, Math.round(sourceWidth * scale));
      const height = Math.max(1, Math.round(sourceHeight * scale));
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d", { alpha: false, willReadFrequently: true });
      ctx.drawImage(image, 0, 0, width, height);
      convertCanvasToGrayscale(ctx, width, height);
      const blob = await canvasToBlob(canvas, "image/jpeg", quality);
      if (!blob) {
        return { blob: file, filename: file.name, compressed: false, grayscale: false, originalSize: file.size, uploadSize: file.size };
      }
      return {
        blob,
        filename: `${imageStem(file.name)}.jpg`,
        compressed: blob.size < file.size,
        grayscale: true,
        originalSize: file.size,
        uploadSize: blob.size,
      };
    }

    function phoneBatchStatusLabel(status) {
      const labels = {
        uploading: "上传中", ready: "待检测", queued: "排队中", detecting: "检测中",
        done: "已完成", partial_failed: "部分失败", interrupted: "已中断",
        uploaded: "待检测", detected: "已完成", detection_error: "检测失败", upload_error: "上传失败",
      };
      return labels[String(status || "")] || String(status || "待上传");
    }

    async function responseJson(response) {
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.detail || payload.message || `HTTP ${response.status}`);
      return payload;
    }

    function scheduleBatchPoll() {
      if (batchPollTimer) window.clearTimeout(batchPollTimer);
      batchPollTimer = null;
      if (!currentBatch || !["queued", "detecting"].includes(currentBatch.status)) return;
      batchPollTimer = window.setTimeout(refreshCurrentBatch, 1000);
    }

    function renderCurrentBatch() {
      batchResults.innerHTML = "";
      const items = currentBatch && Array.isArray(currentBatch.items) ? currentBatch.items : [];
      const running = Boolean(currentBatch && ["queued", "detecting"].includes(currentBatch.status));
      detectBatchBtn.disabled = !items.length || running;
      detectBatchBtn.textContent = running ? "批次检测中" : "检测本次全部";
      deleteBatchBtn.disabled = !currentBatch || running;
      batchSummary.textContent = currentBatch
        ? `${items.length}/9 张 · ${phoneBatchStatusLabel(currentBatch.status)} · 已完成 ${currentBatch.completed_count || 0}`
        : "尚未创建批次";
      if (!items.length) {
        const empty = document.createElement("p");
        empty.textContent = "本次尚未上传照片";
        batchResults.append(empty);
        return;
      }
      for (const item of items) {
        const card = document.createElement("article");
        card.className = "batch-card";
        const media = document.createElement("div");
        media.className = "batch-card-media";
        for (const [label, path] of [["原图", item.raw_image], ["标注图", item.annotated_image]]) {
          if (!path) continue;
          const frame = document.createElement("span");
          frame.className = "batch-card-frame";
          const image = document.createElement("img");
          image.alt = `${item.name || item.upload_id} ${label}`;
          image.src = artifactUrl(path);
          const caption = document.createElement("small");
          caption.textContent = label;
          frame.append(image, caption);
          media.append(frame);
        }
        const body = document.createElement("div");
        body.className = "batch-card-body";
        const title = document.createElement("strong");
        title.textContent = `${Number(item.batch_index || 0) + 1}. ${item.name || item.upload_id}`;
        const status = document.createElement("span");
        const defectSummary = item.status === "detected" ? ` · 缺陷 ${(item.defects || []).length}` : "";
        status.textContent = `${phoneBatchStatusLabel(item.status)}${defectSummary}${item.error ? ` · ${item.error}` : ""}`;
        const defects = document.createElement("span");
        defects.textContent = (item.defects || []).slice(0, 4).map((defect) => {
          const confidence = Math.round(Number(defect.confidence || 0) * 100);
          return `${defect.label || defect.type} ${confidence}%`;
        }).join("；") || "暂无缺陷结果";
        const actions = document.createElement("div");
        actions.className = "batch-card-actions";
        if (item.upload_id) {
          const detect = document.createElement("button");
          detect.type = "button";
          detect.textContent = item.status === "detected" ? "重新检测" : "检测此图";
          detect.disabled = running;
          detect.addEventListener("click", () => detectSingleUpload(item.upload_id));
          const remove = document.createElement("button");
          remove.type = "button";
          remove.textContent = "删除";
          remove.disabled = running;
          remove.addEventListener("click", () => deleteSingleUpload(item.upload_id));
          actions.append(detect, remove);
        }
        if (item.upload_id && item.annotated_image) {
          const download = document.createElement("a");
          download.href = `/api/phone/uploads/${encodeURIComponent(item.upload_id)}/annotated`;
          download.textContent = "导出标记图";
          download.download = `${item.upload_id}_annotated.jpg`;
          actions.append(download);
        }
        body.append(title, status, defects, actions);
        card.append(media, body);
        batchResults.append(card);
      }
    }

    async function refreshCurrentBatch() {
      if (!currentBatchId) {
        currentBatch = null;
        renderCurrentBatch();
        await refreshUploads();
        return;
      }
      try {
        const response = await fetch(`/api/phone/batches/${encodeURIComponent(currentBatchId)}`);
        currentBatch = await responseJson(response);
        renderCurrentBatch();
        await refreshUploads();
        scheduleBatchPoll();
      } catch (error) {
        if (error.message.includes("404")) {
          currentBatchId = "";
          currentBatch = null;
          window.localStorage.removeItem("aoiCurrentPhoneBatchId");
        }
        renderCurrentBatch();
      }
    }

    async function refreshUploads() {
      try {
        const response = await fetch("/api/phone/uploads");
        const payload = await responseJson(response);
        const uploads = Array.isArray(payload.uploads) ? payload.uploads : [];
        const history = uploads.filter((item) => String(item.batch_id || "") !== currentBatchId);
        uploadList.innerHTML = "";
        if (!history.length) {
          const empty = document.createElement("li");
          empty.textContent = "暂无历史上传记录";
          uploadList.append(empty);
          return;
        }
        for (const item of history.slice(0, 12)) {
          const li = document.createElement("li");
          const title = document.createElement("strong");
          title.textContent = item.name || item.upload_id;
          const meta = document.createElement("span");
          const time = item.uploaded_at ? new Date(item.uploaded_at).toLocaleString() : "";
          meta.textContent = `${formatBytes(item.size_bytes)} · ${phoneBatchStatusLabel(item.status)} · ${time}`;
          li.append(title, meta);
          uploadList.append(li);
        }
      } catch (_error) {
        uploadList.innerHTML = "<li>上传列表读取失败</li>";
      }
    }

    function setSelectedFiles(files, sourceLabel) {
      selectedFiles = Array.from(files || []);
      if (!selectedFiles.length) {
        preview.style.display = "none";
        setStatus("等待拍照或选择图片");
        return;
      }
      if (selectedFiles.length > 9) {
        selectedFiles = [];
        preview.style.display = "none";
        setStatus("每次最多选择 9 张照片", "bad");
        return;
      }
      previewImage.src = URL.createObjectURL(selectedFiles[0]);
      preview.style.display = "block";
      const totalSize = selectedFiles.reduce((sum, file) => sum + Number(file.size || 0), 0);
      setStatus(`${sourceLabel}：已选择 ${selectedFiles.length} 张 · ${formatBytes(totalSize)}`);
    }

    takePhotoBtn.addEventListener("click", () => {
      cameraInput.click();
    });

    chooseGalleryBtn.addEventListener("click", () => {
      galleryInput.click();
    });

    cameraInput.addEventListener("change", () => {
      setSelectedFiles(cameraInput.files, "已拍照");
    });

    galleryInput.addEventListener("change", () => {
      setSelectedFiles(galleryInput.files, "已从图库选择");
    });

    uploadBtn.addEventListener("click", async () => {
      if (!selectedFiles.length) {
        setStatus("请先拍照或选择图片", "bad");
        return;
      }
      uploadBtn.disabled = true;
      try {
        const batchResponse = await fetch("/api/phone/batches", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ source: "phone_web" }),
        });
        currentBatch = await responseJson(batchResponse);
        currentBatchId = currentBatch.batch_id;
        window.localStorage.setItem("aoiCurrentPhoneBatchId", currentBatchId);
        let uploaded = 0;
        let failed = 0;
        for (let index = 0; index < selectedFiles.length; index += 1) {
          const file = selectedFiles[index];
          try {
            setStatus(`正在处理 ${index + 1}/${selectedFiles.length}：${file.name}`);
            const prepared = await compressImageForUpload(file);
            const query = new URLSearchParams({
              filename: prepared.filename,
              batch_id: currentBatchId,
              batch_index: String(index),
            });
            const response = await fetch(`/api/phone/upload?${query.toString()}`, {
              method: "POST",
              headers: { "Content-Type": prepared.blob.type || file.type || "application/octet-stream" },
              body: prepared.blob,
            });
            await responseJson(response);
            uploaded += 1;
          } catch (error) {
            failed += 1;
            await fetch(`/api/phone/batches/${encodeURIComponent(currentBatchId)}/upload-error`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                batch_index: index,
                filename: file.name,
                error: error && error.message ? error.message : String(error),
              }),
            }).catch(() => null);
          }
        }
        cameraInput.value = "";
        galleryInput.value = "";
        selectedFiles = [];
        await refreshCurrentBatch();
        setStatus(failed ? `上传完成：成功 ${uploaded} 张，失败 ${failed} 张` : `本次 ${uploaded} 张上传完成`, failed ? "bad" : "ok");
      } catch (error) {
        setStatus(`上传失败：${error.message || error}`, "bad");
      } finally {
        uploadBtn.disabled = false;
      }
    });

    async function detectSingleUpload(uploadId) {
      setStatus("正在检测选中照片...");
      try {
        const response = await fetch("/api/phone/detect", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            upload_id: uploadId,
            detection_profile: profileSelect.value,
            phone_experiment_profile: experimentSelect.value,
          }),
        });
        await responseJson(response);
        await refreshCurrentBatch();
        setStatus("单张检测完成", "ok");
      } catch (error) {
        setStatus(`单张检测失败：${error.message || error}`, "bad");
      }
    }

    async function deleteSingleUpload(uploadId) {
      if (!window.confirm("删除这张上传照片及检测结果？")) return;
      try {
        await responseJson(await fetch(`/api/phone/uploads/${encodeURIComponent(uploadId)}`, { method: "DELETE" }));
        await refreshCurrentBatch();
        setStatus("照片已删除", "ok");
      } catch (error) {
        setStatus(`删除失败：${error.message || error}`, "bad");
      }
    }

    detectBatchBtn.addEventListener("click", async () => {
      if (!currentBatchId) return;
      detectBatchBtn.disabled = true;
      try {
        const response = await fetch(`/api/phone/batches/${encodeURIComponent(currentBatchId)}/detect`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            detection_profile: profileSelect.value,
            phone_experiment_profile: experimentSelect.value,
          }),
        });
        currentBatch = await responseJson(response);
        renderCurrentBatch();
        scheduleBatchPoll();
        setStatus("本次照片已进入顺序检测", "ok");
      } catch (error) {
        setStatus(`批量检测启动失败：${error.message || error}`, "bad");
        renderCurrentBatch();
      }
    });

    deleteBatchBtn.addEventListener("click", async () => {
      if (!currentBatchId || !window.confirm("删除本次批次及全部照片？")) return;
      try {
        await responseJson(await fetch(`/api/phone/batches/${encodeURIComponent(currentBatchId)}`, { method: "DELETE" }));
        currentBatchId = "";
        currentBatch = null;
        window.localStorage.removeItem("aoiCurrentPhoneBatchId");
        renderCurrentBatch();
        await refreshUploads();
        setStatus("本次批次已删除", "ok");
      } catch (error) {
        setStatus(`批次删除失败：${error.message || error}`, "bad");
      }
    });

    refreshCurrentBatch();
    connectInferenceWorker();
  </script>
</body>
</html>
